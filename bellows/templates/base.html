<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bellows{% block title_suffix %}{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <nav class="tab-bar">
        <a href="/" class="tab {% if tab == 'home' %}active{% endif %}">
            <span class="tab-icon">🏠</span>
            <span class="tab-label">Home</span>
        </a>
        <a href="/inbox" class="tab {% if tab == 'inbox' %}active{% endif %}">
            <span class="tab-icon">📥{% if total_decisions %}<span class="tab-badge">{{ total_decisions }}</span>{% endif %}</span>
            <span class="tab-label">Inbox</span>
        </a>
        <a href="/briefing" class="tab {% if tab == 'briefing' %}active{% endif %}">
            <span class="tab-icon">☀️</span>
            <span class="tab-label">Briefing</span>
        </a>
        <a href="/upcoming" class="tab {% if tab == 'upcoming' %}active{% endif %}">
            <span class="tab-icon">📌</span>
            <span class="tab-label">Upcoming</span>
        </a>
    </nav>
</body>
</html>
