<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Cockpit — {{ project }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .cockpit-page { max-width: 1400px; margin: 0 auto; padding: 16px; }
        .cockpit-filters { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap;
                           padding: 12px; background: var(--surface, #1a1a1a);
                           border: 1px solid var(--border, #333); border-radius: 6px;
                           margin-bottom: 12px; }
        .cockpit-filters label { display: flex; flex-direction: column; gap: 2px;
                                 font-size: 11px; color: var(--text-muted, #aaa); }
        .cockpit-filters select, .cockpit-filters input {
            padding: 4px 6px; background: var(--surface-hover, #222);
            border: 1px solid var(--border, #333); color: var(--text, #ddd);
            border-radius: 3px; font: inherit; min-width: 120px;
        }
        .cockpit-stats { font-size: 12px; color: var(--text-muted, #888); margin: 4px 0 8px 0; }
        .cockpit-table { width: 100%; border-collapse: collapse; font-size: 12px;
                         font-family: var(--font-mono, monospace); }
        .cockpit-table th { text-align: left; padding: 6px 8px;
                            border-bottom: 1px solid var(--border, #333);
                            color: var(--text-muted, #888); font-weight: normal; }
        .cockpit-table td { padding: 5px 8px; border-bottom: 1px solid var(--surface-hover, #222);
                            vertical-align: top; }
        .cockpit-table tr.deferred-row { opacity: 0.6; }
        .cockpit-table tr:hover { background: var(--surface, #1a1a1a); }
        .c-expand { cursor: pointer; color: var(--text-muted, #888); width: 16px; }
        .c-id a { color: var(--yellow, #c89c2a); text-decoration: none; }
        .c-stage { font-size: 10px; text-transform: uppercase; padding: 1px 5px;
                   border-radius: 2px; background: var(--surface-hover, #222); }
        .c-hp { white-space: nowrap; }
        .c-hp button { font: inherit; background: transparent; border: 1px solid transparent;
                       color: var(--text-muted, #888); cursor: pointer; padding: 0 3px;
                       border-radius: 2px; }
        .c-hp button:hover { border-color: var(--border, #333); color: var(--text, #ddd); }
        .c-desc { max-width: 360px; overflow: hidden; text-overflow: ellipsis;
                  white-space: nowrap; }
        .c-reason { max-width: 140px; overflow: hidden; text-overflow: ellipsis;
                    white-space: nowrap; color: var(--text-muted, #aaa); font-size: 11px; }
        .c-kebab { cursor: pointer; color: var(--text-muted, #888); padding: 0 4px; }
        .c-empty { padding: 32px; text-align: center; color: var(--text-muted, #888); }
        .c-empty a { color: var(--yellow, #c89c2a); }
        .c-age { color: var(--text-muted, #888); font-size: 11px; white-space: nowrap; }
        .c-skeleton td { padding: 8px; }
        .c-skeleton-bar { display: block; height: 10px; background: var(--surface-hover, #222);
                          border-radius: 2px; animation: c-skel 1.2s infinite; }
        @keyframes c-skel { 0%,100% { opacity: 0.4; } 50% { opacity: 0.7; } }
        .cockpit-table tr.c-focused { background: var(--surface-hover, #222);
                                      outline: 1px solid var(--yellow, #c89c2a); }
        .c-expand { user-select: none; }
        .c-expand.open { color: var(--yellow, #c89c2a); }
        tr.c-inline-panel { background: var(--surface, #141414); }
        tr.c-inline-panel:hover { background: var(--surface, #141414); }
        .c-inline-body { padding: 10px 16px 14px !important; }
        .c-inline-desc { font-size: 13px; margin-bottom: 8px; color: var(--text, #ddd);
                         white-space: pre-wrap; }
        .c-inline-dl { display: grid; grid-template-columns: max-content 1fr;
                       gap: 2px 12px; margin: 0 0 10px 0; font-size: 11px; }
        .c-inline-dl dt { color: var(--text-muted, #888); }
        .c-inline-dl dd { margin: 0; color: var(--text, #ddd); }
        .c-inline-history { font-size: 11px; color: var(--text-muted, #aaa); }
        .c-inline-history ul { margin: 4px 0 0 16px; padding: 0; }
        .c-inline-history li { margin: 1px 0; }
        /* t-389: DnD affordances. Pending rows are draggable. */
        .cockpit-table tr[draggable="true"] { cursor: grab; }
        .cockpit-table tr.c-dragging { opacity: 0.4; }
        .cockpit-table tr.c-drop-above { box-shadow: inset 0 2px 0 0 var(--yellow, #c89c2a); }
        .cockpit-table tr.c-drop-below { box-shadow: inset 0 -2px 0 0 var(--yellow, #c89c2a); }
        @keyframes c-reject-flash { 0%,100% { background: inherit; }
                                    30%,70% { background: rgba(220,60,60,0.25); } }
        .cockpit-table tr.c-drop-reject { animation: c-reject-flash 0.45s ease; }
    </style>
</head>
<body>
    <nav class="steering-nav">
        {% for label, url, active in nav_links %}
        <a href="{{ url }}" class="nav-link">{{ label }}</a>
        {% endfor %}
    </nav>
    <div class="cockpit-page">
        <header>
            <h1>🎛 Queue Cockpit</h1>
            <p class="subtitle">{{ project }} — per-task steering. Scheduler order is authoritative; no client resort.</p>
        </header>

        <div class="cockpit-filters">
            <label>stage
                <select id="f-stage">
                    <option value="">any</option>
                    {% for s in ['research', 'planning', 'implementation', 'testing', 'editing', 'marketing'] %}
                    <option value="{{ s }}" {% if filter_stage == s %}selected{% endif %}>{{ s }}</option>
                    {% endfor %}
                </select>
            </label>
            <label>status
                <select id="f-status">
                    <option value="">any</option>
                    {% for s in ['pending', 'in_flight', 'deferred', 'complete'] %}
                    <option value="{{ s }}" {% if filter_status == s %}selected{% endif %}>{{ s }}</option>
                    {% endfor %}
                </select>
            </label>
            <label>initiative
                <select id="f-ini">
                    <option value="">any</option>
                    {% for ini in initiatives %}
                    <option value="{{ ini.id }}" {% if filter_initiative == ini.id %}selected{% endif %}>{{ ini.id }} · {{ ini.title }}</option>
                    {% endfor %}
                </select>
            </label>
            <label>search
                <input type="text" id="f-q" value="{{ filter_q }}" placeholder="desc substring">
            </label>
            <button onclick="applyFilters()">apply</button>
            <button onclick="clearFilters()">clear</button>
        </div>

        <div class="cockpit-stats" id="stats">Loading…</div>

        <table class="cockpit-table">
            <thead>
                <tr>
                    <th></th>
                    <th>id</th>
                    <th>stage</th>
                    <th>status</th>
                    <th>M</th>
                    <th>you</th>
                    <th>reason</th>
                    <th>initiative</th>
                    <th title="Heats since first worklog mention">age</th>
                    <th>desc</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>
    </div>

    <script>
    function buildUrl() {
        const p = new URLSearchParams();
        const stage = document.getElementById('f-stage').value;
        const status = document.getElementById('f-status').value;
        const ini = document.getElementById('f-ini').value;
        const q = document.getElementById('f-q').value.trim();
        if (stage) p.set('stage', stage);
        if (status) p.set('status', status);
        if (ini) p.set('initiative', ini);
        if (q) p.set('q', q);
        return p;
    }

    function applyFilters() {
        const p = buildUrl();
        const url = '/cockpit' + (p.toString() ? ('?' + p.toString()) : '');
        window.location.href = url;
    }

    function clearFilters() {
        window.location.href = '/cockpit';
    }

    function renderSkeleton() {
        const body = document.getElementById('rows');
        if (body.children.length > 0) return;  // don't blank a populated table
        let html = '';
        for (let i = 0; i < 6; i++) {
            html += '<tr class="c-skeleton">' +
                '<td colspan="11"><span class="c-skeleton-bar"></span></td></tr>';
        }
        body.innerHTML = html;
    }

    function loadRows() {
        const p = buildUrl();
        renderSkeleton();
        fetch('/api/cockpit' + (p.toString() ? ('?' + p.toString()) : ''))
            .then(r => r.json()).then(render)
            .catch(() => { document.getElementById('stats').textContent = 'Failed to load.'; });
    }

    // t-388: taskIds currently expanded inline. Persisted across re-renders
    // so SSE refreshes don't collapse the user's open panels.
    const expanded = new Set();

    function render(data) {
        document.getElementById('stats').textContent =
            data.filtered + ' / ' + data.total + ' tasks';
        const body = document.getElementById('rows');
        body.innerHTML = '';
        if (!data.rows.length) {
            const msg = (data.total === 0)
                ? 'No tasks in this project yet. Add one via <code>smithy add-task</code>.'
                : 'No tasks match the current filters. Try widening or <a href="#" onclick="clearFilters();return false;">clear all</a>.';
            body.innerHTML = `<tr><td colspan="11" class="c-empty">${msg}</td></tr>`;
            return;
        }
        data.rows.forEach(t => {
            const tr = document.createElement('tr');
            if (t.status === 'deferred') tr.classList.add('deferred-row');
            tr.dataset.taskId = t.id;
            tr.dataset.status = t.status;
            tr.dataset.blockedBy = (t.blocked_by || []).join(',');
            // t-389: only pending rows are reorderable.
            if (t.status === 'pending') {
                tr.draggable = true;
                tr.addEventListener('dragstart', onRowDragStart);
                tr.addEventListener('dragover', onRowDragOver);
                tr.addEventListener('dragleave', onRowDragLeave);
                tr.addEventListener('drop', onRowDrop);
                tr.addEventListener('dragend', onRowDragEnd);
            }
            const hp = (t.human_priority == null) ? '—' : ('p' + t.human_priority);
            const isOpen = expanded.has(t.id);
            tr.innerHTML =
                `<td class="c-expand ${isOpen ? 'open' : ''}" onclick="toggleInlineExpand(event, '${t.id}')">${isOpen ? '▾' : '▸'}</td>` +
                `<td class="c-id"><a href="#" onclick="openDrawer('${t.id}');return false;">${t.id}</a></td>` +
                `<td><span class="c-stage stage-${t.stage}">${t.stage}</span></td>` +
                `<td>${t.status}</td>` +
                `<td>p${t.priority == null ? '?' : t.priority}</td>` +
                `<td class="c-hp">` +
                  `<button title="priority up" onclick="bumpHP('${t.id}', -1)">↑</button>` +
                  `<span>${hp}</span>` +
                  `<button title="priority down" onclick="bumpHP('${t.id}', 1)">↓</button>` +
                  `<button title="clear" onclick="clearHP('${t.id}')">✕</button>` +
                `</td>` +
                `<td class="c-reason" title="${(t.priority_reason || '').replace(/"/g, '&quot;')}">${t.priority_reason || '—'}</td>` +
                `<td>${t.initiative_id || '—'}</td>` +
                `<td class="c-age">${t.age_heats == null ? '—' : (t.age_heats + 'h')}</td>` +
                `<td class="c-desc" title="${(t.desc || '').replace(/"/g, '&quot;')}">${t.desc || ''}</td>` +
                `<td><span class="c-kebab" onclick="toggleDefer('${t.id}', '${t.status}')" title="defer/undefer">${t.status === 'deferred' ? '▶' : '⏸'}</span></td>`;
            body.appendChild(tr);
            if (isOpen) {
                const panel = buildInlinePanel(t);
                body.appendChild(panel);
            }
        });
    }

    function buildInlinePanel(t) {
        const tr = document.createElement('tr');
        tr.className = 'c-inline-panel';
        tr.dataset.panelFor = t.id;
        tr.innerHTML =
            `<td></td><td colspan="10" class="c-inline-body">
                <div class="c-inline-desc">${(t.desc || '(no description)').replace(/</g,'&lt;')}</div>
                <dl class="c-inline-dl">
                    <dt>reason</dt><dd>${t.priority_reason || '—'}</dd>
                    <dt>initiative</dt><dd>${t.initiative_id || '—'}</dd>
                    <dt>blocked by</dt><dd>${(t.blocked_by || []).join(', ') || '—'}</dd>
                    <dt>age</dt><dd>${t.age_heats == null ? '—' : (t.age_heats + ' heats')}</dd>
                </dl>
                <div class="c-inline-history" data-history-for="${t.id}">Loading history…</div>
            </td>`;
        // Fetch full detail (history) lazily.
        fetch('/api/task/' + t.id).then(r => r.json()).then(data => {
            const box = tr.querySelector('.c-inline-history');
            if (!box) return;
            const hist = (data.history || []).slice(0, 6);
            if (!hist.length) { box.textContent = 'No history recorded.'; return; }
            box.innerHTML = '<strong>history</strong><ul>' + hist.map(h =>
                `<li>${h.ts ? h.ts.slice(0,16).replace('T',' ') : ''} · ${h.source}` +
                (h.field ? ` — ${h.field}: ${h.before} → ${h.after}` : '') + '</li>'
            ).join('') + '</ul>';
        }).catch(() => {
            const box = tr.querySelector('.c-inline-history');
            if (box) box.textContent = '(history unavailable)';
        });
        return tr;
    }

    function toggleInlineExpand(evt, taskId) {
        // MUST: stop propagation so any wrapping handlers don't navigate.
        if (evt) { evt.stopPropagation(); evt.preventDefault(); }
        if (expanded.has(taskId)) expanded.delete(taskId);
        else expanded.add(taskId);
        // Re-render without refetch — flip panel on the current dataset.
        const body = document.getElementById('rows');
        const tr = body.querySelector(`tr[data-task-id="${taskId}"]`);
        if (!tr) { loadRows(); return; }
        const existing = body.querySelector(`tr.c-inline-panel[data-panel-for="${taskId}"]`);
        const chev = tr.querySelector('.c-expand');
        if (existing) {
            existing.remove();
            if (chev) { chev.textContent = '▸'; chev.classList.remove('open'); }
        } else {
            // Build from the row's current data via /api/task. We don't have the
            // full row object here; synthesize from visible cells + fetch.
            fetch('/api/task/' + taskId).then(r => r.json()).then(data => {
                const task = data.task || {};
                task.age_heats = null; // age stays on the collapsed row; panel uses worklog count
                const panel = buildInlinePanel(task);
                tr.after(panel);
                if (chev) { chev.textContent = '▾'; chev.classList.add('open'); }
            });
        }
    }

    function openDrawer(taskId) {
        // Deep-link via ?task= — Poker home handles the drawer.
        window.location.href = '/?task=' + encodeURIComponent(taskId);
    }

    function bumpHP(taskId, delta) {
        // Read current, offset by delta. A null hp becomes delta directly (signed).
        fetch('/api/task/' + taskId).then(r => r.json()).then(data => {
            const cur = (data.task && data.task.human_priority);
            const next = (cur == null ? 0 : cur) + delta;
            return fetch('/api/task/' + taskId + '/human-priority', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({value: next})
            });
        }).then(loadRows);
    }

    function clearHP(taskId) {
        fetch('/api/task/' + taskId + '/human-priority', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({value: null})
        }).then(loadRows);
    }

    function toggleDefer(taskId, status) {
        const path = (status === 'deferred') ? '/undefer' : '/defer';
        fetch('/api/task/' + taskId + path, {method: 'POST'}).then(loadRows);
    }

    // t-389: DnD reorder within the Pending section.
    // Drop at top → hp=0. Elsewhere → hp = idx*10 across all pending rows.
    // Blocked tasks snap back above their blocker (visual reject, no fetch).
    let dragState = null;

    function pendingRows() {
        return Array.from(document.querySelectorAll(
            '#rows tr[data-task-id][data-status="pending"]'));
    }

    function onRowDragStart(evt) {
        const tr = evt.currentTarget;
        dragState = { id: tr.dataset.taskId, row: tr };
        tr.classList.add('c-dragging');
        if (evt.dataTransfer) {
            evt.dataTransfer.effectAllowed = 'move';
            evt.dataTransfer.setData('text/plain', tr.dataset.taskId);
        }
    }

    function onRowDragOver(evt) {
        if (!dragState) return;
        const tr = evt.currentTarget;
        if (tr === dragState.row) return;
        evt.preventDefault();
        if (evt.dataTransfer) evt.dataTransfer.dropEffect = 'move';
        const rect = tr.getBoundingClientRect();
        const above = (evt.clientY - rect.top) < rect.height / 2;
        tr.classList.toggle('c-drop-above', above);
        tr.classList.toggle('c-drop-below', !above);
    }

    function onRowDragLeave(evt) {
        evt.currentTarget.classList.remove('c-drop-above', 'c-drop-below');
    }

    function onRowDragEnd(evt) {
        evt.currentTarget.classList.remove('c-dragging');
        document.querySelectorAll('.c-drop-above, .c-drop-below')
            .forEach(el => el.classList.remove('c-drop-above', 'c-drop-below'));
        dragState = null;
    }

    function onRowDrop(evt) {
        if (!dragState) return;
        evt.preventDefault();
        const target = evt.currentTarget;
        const rect = target.getBoundingClientRect();
        const above = (evt.clientY - rect.top) < rect.height / 2;
        target.classList.remove('c-drop-above', 'c-drop-below');
        const draggedId = dragState.id;
        if (target === dragState.row) return;

        // Compute candidate new order of pending ids.
        const current = pendingRows().map(r => r.dataset.taskId);
        const withoutDragged = current.filter(id => id !== draggedId);
        const targetId = target.dataset.taskId;
        const insertAt = withoutDragged.indexOf(targetId) + (above ? 0 : 1);
        const newOrder = withoutDragged.slice(0, insertAt)
            .concat([draggedId])
            .concat(withoutDragged.slice(insertAt));

        // Blocker pre-check (client-side snap-back). Server repeats the check.
        const blockedBy = (dragState.row.dataset.blockedBy || '')
            .split(',').filter(Boolean);
        const draggedIdx = newOrder.indexOf(draggedId);
        const violation = blockedBy.find(b => {
            const bi = newOrder.indexOf(b);
            return bi !== -1 && bi >= draggedIdx;
        });
        if (violation) {
            dragState.row.classList.add('c-drop-reject');
            setTimeout(() => dragState && dragState.row &&
                dragState.row.classList.remove('c-drop-reject'), 500);
            return;
        }

        fetch('/api/reorder-tasks', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({order: newOrder})
        }).then(r => r.json()).then(resp => {
            if (!resp.ok) {
                // Server rejected (concurrent blocker change). Flash + refetch.
                target.classList.add('c-drop-reject');
                setTimeout(() => target.classList.remove('c-drop-reject'), 500);
            }
            loadRows();
        });
    }

    // Keyboard nav (t-379): j/k move row focus, Enter opens drawer, x toggles defer.
    let focusedIndex = -1;
    function focusRow(i) {
        const rows = document.querySelectorAll('#rows tr[data-task-id]');
        if (!rows.length) return;
        rows.forEach(r => r.classList.remove('c-focused'));
        focusedIndex = Math.max(0, Math.min(i, rows.length - 1));
        rows[focusedIndex].classList.add('c-focused');
        rows[focusedIndex].scrollIntoView({block: 'nearest'});
    }
    document.addEventListener('keydown', e => {
        // Skip when typing in filter inputs.
        const tag = (e.target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
        if (e.key === 'j') { e.preventDefault(); focusRow(focusedIndex + 1); }
        else if (e.key === 'k') { e.preventDefault(); focusRow(focusedIndex - 1); }
        else if (e.key === 'Enter' && focusedIndex >= 0) {
            const row = document.querySelectorAll('#rows tr[data-task-id]')[focusedIndex];
            if (row) openDrawer(row.dataset.taskId);
        } else if (e.key === 'x' && focusedIndex >= 0) {
            const row = document.querySelectorAll('#rows tr[data-task-id]')[focusedIndex];
            if (row) {
                const isDeferred = row.classList.contains('deferred-row');
                toggleDefer(row.dataset.taskId, isDeferred ? 'deferred' : 'pending');
            }
        }
    });

    // Live refresh via Poker's SSE stream.
    try {
        const es = new EventSource('/events');
        es.onmessage = () => loadRows();
    } catch (e) { /* SSE unavailable — polling fallback below */ }
    setInterval(loadRows, 15000);
    loadRows();
    </script>
</body>
</html>
