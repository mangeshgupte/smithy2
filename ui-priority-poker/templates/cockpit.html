<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Cockpit — {{ project }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* t-547: full-viewport width — no max-width cap or centering;
           slim side padding. Human feedback: wasted space left/right. */
        /* t-557: typography scale — the cockpit's single source of truth
           for type size, weight, and line-height. Every font-size below
           references an --fs-* token instead of a one-off px value. The
           four steps preserve the pre-t-557 rendered sizes (12/13/14/15)
           so this is a tokenization + weight/letter-spacing/line-height
           pass, not a resize — no layout shift.
             --fs-xs  smallest: uppercase badges, age, section heads,
                      ship heat/sha, desc preview, bounce badge
             --fs-sm  secondary: filter labels, inline dl/history, reason
             --fs-md  base: table body, stats, toast, controls
             --fs-lg  emphasis: expanded inline description
           Weight (not just size) carries hierarchy: the task id reads
           medium, descriptions regular, metadata muted. Expanded views
           relax to --lh-relaxed for readability; dense rows stay tight. */
        .cockpit-page {
            padding: 16px 12px;
            --fs-xs: 12px;
            --fs-sm: 13px;
            --fs-md: 14px;
            --fs-lg: 15px;
            --fw-regular: 400;
            --fw-medium: 500;
            --lh-relaxed: 1.4;
        }
        /* t-558: cockpit color — the palette lives in ONE place. The base
           tokens (--bg, --surface, --surface-hover, --border, --text,
           --text-muted, --yellow, --red, --blue) come from style.css :root
           (the GitHub-dark theme). The cockpit used to repeat inline
           fallbacks (var(--surface,#1a1a1a), #888, #c89c2a, …) that had
           drifted from that theme — they never rendered (the global token
           always wins) and only misled, so they're gone. --text-muted
           (#8b949e) clears WCAG AA on --bg and --surface (~5:1); the old
           borderline #888 was one of those dead fallbacks. These two
           derive cockpit-semantic colors from the theme so status colors
           stay meaningful without a second palette. */
        :root {
            --c-link: var(--blue);            /* initiative links */
            --c-row-inprogress: var(--blue);  /* in_progress row accent */
        }
        .cockpit-filters { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap;
                           padding: 12px; background: var(--surface);
                           border: 1px solid var(--border); border-radius: 6px;
                           margin-bottom: 12px; }
        .cockpit-filters label { display: flex; flex-direction: column; gap: 4px;
                                 font-size: var(--fs-sm); color: var(--text-muted); }
        .cockpit-filters select, .cockpit-filters input {
            padding: 4px 8px; background: var(--surface-hover);
            border: 1px solid var(--border); color: var(--text);
            border-radius: 3px; font: inherit; min-width: 120px;
        }
        .cockpit-stats { font-size: var(--fs-md); color: var(--text-muted); margin: 4px 0 8px 0; }
        .cockpit-table { width: 100%; border-collapse: collapse; font-size: var(--fs-md);
                         font-family: var(--font-mono, monospace); }
        .cockpit-table th { text-align: left; padding: 8px;
                            border-bottom: 1px solid var(--border);
                            color: var(--text-muted); font-weight: normal; }
        .cockpit-table td { padding: 4px 8px; border-bottom: 1px solid var(--surface-hover);
                            vertical-align: top; }
        .cockpit-table tr.deferred-row { opacity: 0.6; }
        .cockpit-table tr:hover { background: var(--surface); }
        /* t-558: in_progress rows carry a calm left accent so active work
           reads at a glance — distinct from :hover (bg) and keyboard
           focus (outline), and quiet enough not to shout. Same inset
           box-shadow trick the drag indicators use (works on table rows
           under border-collapse). */
        .cockpit-table tr[data-status="in_progress"] {
            box-shadow: inset 3px 0 0 0 var(--c-row-inprogress);
        }
        .c-expand { cursor: pointer; color: var(--text-muted); width: 16px; }
        /* t-557: task id carries weight (medium) not just color — the
           strongest per-row anchor for scanning. */
        .c-id a { color: var(--yellow); text-decoration: none;
                  font-weight: var(--fw-medium); }
        /* t-557: small uppercase badges get letter-spacing so the glyphs
           don't crowd at --fs-xs (keeps uppercase, just legible). */
        .c-stage { font-size: var(--fs-xs); text-transform: uppercase; padding: 2px 4px;
                   border-radius: 2px; background: var(--surface-hover);
                   letter-spacing: 0.04em; }
        .c-hp { white-space: nowrap; }
        .c-hp button { font: inherit; background: transparent; border: 1px solid transparent;
                       color: var(--text-muted); cursor: pointer; padding: 0 4px;
                       border-radius: 2px; }
        .c-hp button:hover { border-color: var(--border); color: var(--text); }
        .c-desc { max-width: 360px; overflow: hidden; text-overflow: ellipsis;
                  white-space: nowrap; }
        .c-reason { max-width: 140px; overflow: hidden; text-overflow: ellipsis;
                    white-space: nowrap; color: var(--text-muted); font-size: var(--fs-sm); }
        .c-kebab { cursor: pointer; color: var(--text-muted); padding: 0 4px; }
        /* t-556: numeric columns (priority, hp, age, heat) right-align,
           headers matching cells. */
        .cockpit-table th.c-num, .cockpit-table td.c-num { text-align: right; }
        .cockpit-table .c-hp, .cockpit-table .c-age,
        .cockpit-table .c-ship-heat { text-align: right; }
        /* t-556: chevron, id, stage badge vertically centered in rows. */
        .cockpit-table td.c-expand, .cockpit-table td.c-id,
        .cockpit-table td.c-stage-cell { vertical-align: middle; }
        /* t-556: filter bar controls share one baseline. */
        .cockpit-filters button { padding: 4px 8px; font: inherit; }
        /* t-548: bounce badge — rejected-task heat pair in the reason cell. */
        .c-bounce { color: var(--red); font-size: var(--fs-xs); margin-left: 8px;
                    white-space: nowrap; }
        .c-empty { padding: 32px; text-align: center; color: var(--text-muted); }
        .c-empty a { color: var(--yellow); }
        .c-age { color: var(--text-muted); font-size: var(--fs-sm); white-space: nowrap; }
        .c-skeleton td { padding: 8px; }
        .c-skeleton-bar { display: block; height: 10px; background: var(--surface-hover);
                          border-radius: 2px; animation: c-skel 1.2s infinite; }
        @keyframes c-skel { 0%,100% { opacity: 0.4; } 50% { opacity: 0.7; } }
        .cockpit-table tr.c-focused { background: var(--surface-hover);
                                      outline: 1px solid var(--yellow); }
        .c-expand { user-select: none; }
        .c-expand.open { color: var(--yellow); }
        tr.c-inline-panel { background: var(--surface); }
        tr.c-inline-panel:hover { background: var(--surface); }
        /* t-557: the expanded panel is reading material — relax leading
           across the whole body (desc, dl, history) to ~1.4. */
        .c-inline-body { padding: 12px 8px 16px !important; line-height: var(--lh-relaxed); }
        /* t-557: descriptions read regular weight — size (not boldness)
           sets them apart from the medium-weight task id above. */
        .c-inline-desc { font-size: var(--fs-lg); margin-bottom: 8px; color: var(--text);
                         white-space: pre-wrap; line-height: var(--lh-relaxed);
                         font-weight: var(--fw-regular);
                         /* t-580: explicit monospace so the expanded desc's
                            newlines + runs of spaces render exactly (set via
                            textContent in buildInlinePanel). */
                         font-family: var(--font-mono, monospace); }
        .c-inline-dl { display: grid; grid-template-columns: max-content 1fr;
                       gap: 4px 12px; margin: 0 0 12px 0; font-size: var(--fs-sm); }
        .c-inline-dl dt { color: var(--text-muted); }
        .c-inline-dl dd { margin: 0; color: var(--text); }
        .c-inline-history { font-size: var(--fs-sm); color: var(--text-muted); }
        .c-inline-history ul { margin: 4px 0 0 16px; padding: 0; }
        .c-inline-history li { margin: 1px 0; }
        /* t-390: section headers — dense, muted, click to collapse. */
        tr.c-section-head td { padding: 12px 8px 4px; border-bottom: none;
                               font-size: var(--fs-xs); text-transform: uppercase;
                               letter-spacing: 0.08em; color: var(--text-muted);
                               cursor: pointer; user-select: none; }
        tr.c-section-head:hover td { color: var(--text); }
        .c-section-chip { display: inline-block; margin-left: 8px; padding: 0 4px;
                          background: var(--surface-hover); color: var(--text);
                          border-radius: 8px; font-size: var(--fs-xs); }
        .c-section-caret { display: inline-block; width: 10px; }
        /* t-391: Complete-section row shape — dimmer, smaller, shipped metadata. */
        tr.c-complete-row td { color: var(--text-muted); }
        .c-complete-row .c-id a { color: var(--text-muted); }
        .c-ship-val { white-space: nowrap; }
        .c-ship-heat { color: var(--text-muted); font-size: var(--fs-sm); }
        .c-ship-sha { font-size: var(--fs-sm); }
        .c-ship-sha code { background: var(--surface-hover); padding: 2px 4px;
                           border-radius: 2px; color: var(--yellow); }
        /* t-392: undo toast. Fixed bottom-right, auto-dismisses in 6s. */
        .c-toast { position: fixed; right: 16px; bottom: 16px;
                   background: var(--surface); border: 1px solid var(--border);
                   padding: 8px 12px; border-radius: 4px; font-size: var(--fs-md);
                   display: flex; align-items: center; gap: 8px; z-index: 1000;
                   box-shadow: 0 4px 14px rgba(0,0,0,0.4); }
        .c-toast[hidden] { display: none; }
        .c-toast button { background: transparent; border: 1px solid var(--yellow);
                          color: var(--yellow); padding: 4px 8px; border-radius: 2px;
                          cursor: pointer; font: inherit; }
        .c-toast button:hover { background: var(--yellow); color: #000; }
        /* t-546: whole row is a click target for expand/collapse.
           Declared BEFORE the draggable rule so pending rows keep the
           grab cursor (same specificity — later declaration wins). */
        .cockpit-table tr[data-task-id] { cursor: pointer; }
        /* t-389: DnD affordances. Pending rows are draggable. */
        .cockpit-table tr[draggable="true"] { cursor: grab; }
        .cockpit-table tr.c-dragging { opacity: 0.4; }
        .cockpit-table tr.c-drop-above { box-shadow: inset 0 2px 0 0 var(--yellow); }
        .cockpit-table tr.c-drop-below { box-shadow: inset 0 -2px 0 0 var(--yellow); }
        @keyframes c-reject-flash { 0%,100% { background: inherit; }
                                    30%,70% { background: rgba(220,60,60,0.25); } }
        .cockpit-table tr.c-drop-reject { animation: c-reject-flash 0.45s ease; }
        /* t-380: bulk-select bar. Appears above table when ≥1 row checked. */
        .c-bulk-bar { display: flex; align-items: center; gap: 8px;
                      padding: 8px 12px; margin-bottom: 8px;
                      background: var(--surface);
                      border: 1px solid var(--yellow); border-radius: 4px;
                      font-size: var(--fs-md); }
        .c-bulk-bar[hidden] { display: none; }
        .c-bulk-bar button { font: inherit; background: transparent;
                             border: 1px solid var(--border);
                             color: var(--text); padding: 4px 8px;
                             border-radius: 2px; cursor: pointer; }
        .c-bulk-bar button:hover { border-color: var(--yellow);
                                   color: var(--yellow); }
        .c-bulk-bar .c-bulk-clear { margin-left: auto; color: var(--text-muted); }
        .c-check { width: 18px; text-align: center; }
        .c-check input { cursor: pointer; margin: 0; }
        /* t-527: desc row sits below each task row; muted, preserves
           whitespace, click toggles the inline panel. */
        .c-desc-row td.c-desc-cell {
            color: var(--text-muted);
            /* t-580: single-line first-line preview, truncated with an
               ellipsis (was white-space:pre-wrap, which let multi-line descs
               render as a tall cluttered blob). max-width:0 is the table-cell
               ellipsis trick: the cell takes its distributed share and clips
               instead of growing, so there's no horizontal overflow. */
            max-width: 0;
            white-space: nowrap;
            overflow: hidden;
            padding: 4px 8px 8px;
            border-top: none;
            cursor: pointer;
            font-size: var(--fs-xs);
            line-height: var(--lh-relaxed);
        }
        /* t-580: flex line lets the first-line desc truncate with an ellipsis
           while the t-548 bounce badge stays fully visible beside it. */
        .c-desc-row td.c-desc-cell .c-desc-line {
            display: flex; align-items: baseline; gap: 8px; min-width: 0;
        }
        .c-desc-row td.c-desc-cell .c-desc-preview {
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            min-width: 0; flex: 0 1 auto;
        }
        .c-desc-row td.c-desc-cell .c-bounce { flex: none; margin-left: 0; }
        .c-desc-row td.c-desc-cell:hover { color: var(--text); }
        .c-ini-link { color: var(--c-link); text-decoration: none; }
        .c-ini-link:hover { text-decoration: underline; }
    </style>
    <script>
        // t-527: surface cross-service Bellows URL + project name so
        // initiative cells in the primary row can link out.
        window.COCKPIT_BELLOWS_URL = {{ url_bellows | tojson }};
        window.COCKPIT_PROJECT_NAME = {{ project | tojson }};
    </script>
</head>
<body>
    <!-- t-586: NO .reading wrapper here. The cockpit is a wide multi-column
         task table; t-579's .reading{max-width:750px} cap squished it and
         re-wasted the side gutters t-547 deliberately removed. Standalone
         /cockpit renders full-bleed; .reading stays for activity.html (prose). -->
    <nav class="steering-nav">
        {% for label, url, active in nav_links %}
        <a href="{{ url }}" class="nav-link{% if active %} active{% endif %}">{{ label }}</a>
        {% endfor %}
    </nav>
    <div class="cockpit-page">
        <header>
            <h1>🎛 Queue Cockpit</h1>
            <p class="subtitle">{{ project }} — per-task steering. In-flight first, then by priority, then by id — scheduler's next_tasks ordering surfaces via the priority numbers.</p>
        </header>

        <div class="cockpit-filters">
            <label>stage
                <select id="f-stage">
                    <option value="">any</option>
                    {% for s in ['research', 'planning', 'implementation', 'testing', 'editing', 'marketing'] %}
                    <option value="{{ s }}" {% if filter_stage == s %}selected{% endif %}>{{ s }}</option>
                    {% endfor %}
                </select>
            </label>
            <label>status
                <select id="f-status">
                    <option value="">any</option>
                    {% for s in ['pending', 'in_progress', 'deferred', 'complete', 'submitted'] %}
                    <option value="{{ s }}" {% if filter_status == s %}selected{% endif %}>{{ s }}</option>
                    {% endfor %}
                </select>
            </label>
            <label>initiative
                <select id="f-ini">
                    <option value="">any</option>
                    {% for ini in initiatives %}
                    <option value="{{ ini.id }}" {% if filter_initiative == ini.id %}selected{% endif %}>{{ ini.id }} · {{ ini.title }}</option>
                    {% endfor %}
                </select>
            </label>
            <label>search
                <input type="text" id="f-q" value="{{ filter_q }}" placeholder="desc substring">
            </label>
            <button onclick="applyFilters()">apply</button>
            <button onclick="clearFilters()">clear</button>
        </div>

        <div class="cockpit-stats" id="stats">Loading…</div>

        <div id="c-bulk-bar" class="c-bulk-bar" hidden>
            <span id="c-bulk-count">0 selected</span>
            <button type="button" onclick="bulkAction('defer')">Defer</button>
            <button type="button" onclick="bulkAction('undefer')">Undefer</button>
            <button type="button" onclick="bulkAction('clear-hp')">Clear hp</button>
            <button type="button" class="c-bulk-clear" onclick="clearBulkSelection()">Clear selection</button>
        </div>

        <table class="cockpit-table">
            <thead>
                <tr>
                    <th class="c-check"><input type="checkbox" id="c-check-all" onclick="toggleSelectAllVisible(this.checked)"></th>
                    <th></th>
                    <th>id</th>
                    <th>stage</th>
                    <th>status</th>
                    <th class="c-num">M</th>
                    <th class="c-num">you</th>
                    <!-- t-527: reason column dropped from the primary
                         row (still rendered inside the inline panel);
                         desc now lives in a second tr per task. -->
                    <th>initiative</th>
                    <th class="c-num" title="Minutes since task was filed">age</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>

        <div id="c-toast" class="c-toast" hidden>
            <span id="c-toast-msg"></span>
            <button id="c-toast-undo" type="button">undo</button>
        </div>
    </div>

    <script>
    function buildUrl() {
        const p = new URLSearchParams();
        const stage = document.getElementById('f-stage').value;
        const status = document.getElementById('f-status').value;
        const ini = document.getElementById('f-ini').value;
        const q = document.getElementById('f-q').value.trim();
        if (stage) p.set('stage', stage);
        if (status) p.set('status', status);
        if (ini) p.set('initiative', ini);
        if (q) p.set('q', q);
        return p;
    }

    function applyFilters() {
        const p = buildUrl();
        const url = '/cockpit' + (p.toString() ? ('?' + p.toString()) : '');
        window.location.href = url;
    }

    function clearFilters() {
        window.location.href = '/cockpit';
    }

    function renderSkeleton() {
        const body = document.getElementById('rows');
        if (body.children.length > 0) return;  // don't blank a populated table
        let html = '';
        for (let i = 0; i < 6; i++) {
            // t-527: primary row is now 10 cells (was 12). Skeleton
            // colspan matches to keep the spinner full-width.
            html += '<tr class="c-skeleton">' +
                '<td colspan="10"><span class="c-skeleton-bar"></span></td></tr>';
        }
        body.innerHTML = html;
    }

    // t-527: Bellows cross-service URL and project name for initiative
    // links in the primary row. Both injected via the Jinja context in
    // cockpit.html's <head>.
    const BELLOWS_URL = (window.COCKPIT_BELLOWS_URL || '').replace(/\/$/, '');
    const PROJECT_NAME = window.COCKPIT_PROJECT_NAME || '';

    function formatAge(m) {
        if (m == null) return '—';
        if (m < 60) return m + 'm';
        const h = Math.floor(m / 60);
        return h + 'h';
    }

    function loadRows() {
        const p = buildUrl();
        renderSkeleton();
        fetch('/api/cockpit' + (p.toString() ? ('?' + p.toString()) : ''))
            .then(r => r.json()).then(render)
            .catch(() => { document.getElementById('stats').textContent = 'Failed to load.'; });
    }

    // t-380: bulk-selected task ids. Persisted across re-renders so SSE
    // refreshes don't drop the user's selection. Only pending+deferred rows
    // carry a checkbox.
    const bulkSelected = new Set();

    function refreshBulkBar() {
        const bar = document.getElementById('c-bulk-bar');
        const cnt = document.getElementById('c-bulk-count');
        if (!bar || !cnt) return;
        bar.hidden = bulkSelected.size === 0;
        cnt.textContent = bulkSelected.size + ' selected';
        // Sync the header checkbox indeterminate/checked state.
        const head = document.getElementById('c-check-all');
        if (head) {
            const boxes = document.querySelectorAll('#rows input[data-bulk-id]');
            const checkedBoxes = document.querySelectorAll(
                '#rows input[data-bulk-id]:checked');
            head.indeterminate = checkedBoxes.length > 0 &&
                                 checkedBoxes.length < boxes.length;
            head.checked = boxes.length > 0 &&
                           checkedBoxes.length === boxes.length;
        }
    }

    function onBulkCheck(evt) {
        const cb = evt.currentTarget;
        const id = cb.dataset.bulkId;
        if (cb.checked) bulkSelected.add(id);
        else bulkSelected.delete(id);
        refreshBulkBar();
    }

    function toggleSelectAllVisible(on) {
        const boxes = document.querySelectorAll('#rows input[data-bulk-id]');
        boxes.forEach(cb => {
            cb.checked = on;
            const id = cb.dataset.bulkId;
            if (on) bulkSelected.add(id);
            else bulkSelected.delete(id);
        });
        refreshBulkBar();
    }

    function clearBulkSelection() {
        bulkSelected.clear();
        document.querySelectorAll('#rows input[data-bulk-id]:checked')
            .forEach(cb => cb.checked = false);
        refreshBulkBar();
    }

    function bulkAction(action) {
        const ids = Array.from(bulkSelected);
        if (!ids.length) return;
        fetch('/api/bulk', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({action, ids}),
        }).then(r => r.json()).then(resp => {
            if (!resp.ok) { alert('Bulk failed: ' + (resp.error || 'unknown')); return; }
            bulkSelected.clear();
            loadRows();
        });
    }

    // t-388: taskIds currently expanded inline. Persisted across re-renders
    // so SSE refreshes don't collapse the user's open panels.
    const expanded = new Set();

    // t-390: collapsible section state. Pending is always open. Deferred and
    // Complete default collapsed; persist across SSE refreshes in-page.
    const sectionOpen = { pending: true, deferred: false, complete: false };

    function splitSections(rows) {
        const pending = [], deferred = [], complete = [];
        rows.forEach(r => {
            if (r.status === 'deferred') deferred.push(r);
            else if (r.status === 'complete') complete.push(r);
            else pending.push(r);   // pending + in_progress + submitted → Pending section
        });
        // t-536: sort the pending bucket client-side: in_progress first,
        // then by priority ascending (0 = highest), then by id for a
        // stable tiebreaker. The server still returns scheduler-ordered
        // rows; we re-bucket for visual clarity so active work is
        // always at the top. Drag-drop still writes to next_tasks
        // server-side; the visual sort sits on top of that.
        pending.sort((a, b) => {
            const sa = a.status === 'in_progress' ? 0 : 1;
            const sb = b.status === 'in_progress' ? 0 : 1;
            if (sa !== sb) return sa - sb;                    // in_progress first
            const pa = (a.priority == null) ? 99 : a.priority;
            const pb = (b.priority == null) ? 99 : b.priority;
            if (pa !== pb) return pa - pb;                    // lower num = higher pri
            return (a.id || '').localeCompare(b.id || '');    // stable id tiebreak
        });
        // Complete: reverse by last worklog timestamp (newest first). Server
        // order is scheduler; we re-sort just this section.
        complete.sort((a, b) => (b.last_worklog_ts || '').localeCompare(a.last_worklog_ts || ''));
        return { pending, deferred, complete };
    }

    function renderSectionHead(body, key, label, count) {
        const tr = document.createElement('tr');
        tr.className = 'c-section-head';
        tr.dataset.section = key;
        const caret = sectionOpen[key] ? '▾' : '▸';
        tr.innerHTML = `<td colspan="10"><span class="c-section-caret">${caret}</span>` +
                       ` ${label} <span class="c-section-chip">${count}</span></td>`;
        tr.addEventListener('click', () => {
            sectionOpen[key] = !sectionOpen[key];
            render(lastData);
        });
        body.appendChild(tr);
    }

    let lastData = { rows: [], filtered: 0, total: 0 };

    function render(data) {
        lastData = data;
        document.getElementById('stats').textContent =
            data.filtered + ' / ' + data.total + ' tasks';
        const body = document.getElementById('rows');
        body.innerHTML = '';
        if (!data.rows.length) {
            const msg = (data.total === 0)
                ? 'No tasks in this project yet. Add one via <code>smithy add-task</code>.'
                : 'No tasks match the current filters. Try widening or <a href="#" onclick="clearFilters();return false;">clear all</a>.';
            body.innerHTML = `<tr><td colspan="10" class="c-empty">${msg}</td></tr>`;
            return;
        }
        const sections = splitSections(data.rows);
        const plan = [
            ['pending', 'Pending', sections.pending],
            ['deferred', 'Deferred', sections.deferred],
            ['complete', 'Complete', sections.complete],
        ];
        plan.forEach(([key, label, rows]) => {
            if (!rows.length) return;
            renderSectionHead(body, key, label, rows.length);
            if (sectionOpen[key]) rows.forEach(t => renderRow(body, t));
        });
        refreshBulkBar();
    }

    function renderRow(body, t) {
            if (t.status === 'complete') { renderCompleteRow(body, t); return; }
            const tr = document.createElement('tr');
            if (t.status === 'deferred') tr.classList.add('deferred-row');
            tr.dataset.taskId = t.id;
            tr.dataset.status = t.status;
            tr.dataset.blockedBy = (t.blocked_by || []).join(',');
            // t-389: only pending rows are reorderable.
            if (t.status === 'pending') {
                tr.draggable = true;
                tr.addEventListener('dragstart', onRowDragStart);
                tr.addEventListener('dragover', onRowDragOver);
                tr.addEventListener('dragleave', onRowDragLeave);
                tr.addEventListener('drop', onRowDrop);
                tr.addEventListener('dragend', onRowDragEnd);
            }
            const hp = (t.human_priority == null) ? '—' : ('p' + t.human_priority);
            const isOpen = expanded.has(t.id);
            const checked = bulkSelected.has(t.id) ? 'checked' : '';
            // t-527: primary row drops reason + desc columns. desc
            // now lives in a second <tr.c-desc-row> below; reason stays
            // in the inline panel only. initiative_id linkifies to
            // Bellows when BELLOWS_URL + PROJECT_NAME are present.
            const iniCell = t.initiative_id
                ? `<a class="c-ini-link" href="${BELLOWS_URL}/project/${encodeURIComponent(PROJECT_NAME)}/initiative/${encodeURIComponent(t.initiative_id)}" target="_blank" rel="noopener">${t.initiative_id}</a>`
                : '—';
            tr.innerHTML =
                `<td class="c-check"><input type="checkbox" data-bulk-id="${t.id}" ${checked} onclick="onBulkCheck(event)"></td>` +
                `<td class="c-expand ${isOpen ? 'open' : ''}" onclick="toggleInlineExpand(event, '${t.id}')">${isOpen ? '▾' : '▸'}</td>` +
                `<td class="c-id"><a href="#" onclick="openDrawer('${t.id}');return false;">${t.id}</a></td>` +
                `<td class="c-stage-cell"><span class="c-stage stage-${t.stage}">${t.stage}</span></td>` +
                `<td>${t.status}</td>` +
                `<td class="c-num">p${t.priority == null ? '?' : t.priority}</td>` +
                `<td class="c-hp">` +
                  `<button title="priority up" onclick="bumpHP('${t.id}', -1)">↑</button>` +
                  `<span>${hp}</span>` +
                  `<button title="priority down" onclick="bumpHP('${t.id}', 1)">↓</button>` +
                  `<button title="clear" onclick="clearHP('${t.id}')">✕</button>` +
                `</td>` +
                `<td>${iniCell}</td>` +
                `<td class="c-age">${formatAge(t.age_minutes)}</td>` +
                `<td><span class="c-kebab" onclick="toggleDefer('${t.id}', '${t.status}')" title="defer/undefer">${t.status === 'deferred' ? '▶' : '⏸'}</span></td>`;
            // t-546: whole-row click toggles the inline panel (the
            // chevron alone was a 16px target). Guard in the handler
            // keeps links/buttons/checkbox/kebab working unchanged.
            tr.addEventListener('click', e => onRowClickToggle(e, t.id));
            body.appendChild(tr);
            // Desc row — always visible; click toggles inline panel
            // for parity with the expand chevron. data-desc-for, NOT
            // data-task-id: every row-query (pendingRows, keyboard nav,
            // panel toggle) selects on data-task-id and must keep
            // matching only primary rows.
            const descRow = document.createElement('tr');
            descRow.className = 'c-desc-row';
            descRow.dataset.descFor = t.id;
            // t-565: the t-548 bounce badge lives here now — t-527's
            // refinements dropped the reason column it used to ride in.
            descRow.innerHTML =
                `<td></td><td></td>` +
                `<td class="c-desc-cell" colspan="8" onclick="toggleInlineExpand(event, '${t.id}')">` +
                `<span class="c-desc-line"><span class="c-desc-preview">${descPreview(t)}</span>${formatBounce(t)}</span>` +
                `</td>`;
            body.appendChild(descRow);
            if (isOpen) {
                const panel = buildInlinePanel(t);
                body.appendChild(panel);
            }
    }

    // t-546: row-background click → expand/collapse. Interactive children
    // keep their own behavior: closest() walks up from the click target,
    // so any click inside a link, button, form control, the defer kebab,
    // or the chevron (which has its own toggle handler that stops
    // propagation — listed here as belt-and-suspenders) is ignored.
    function onRowClickToggle(evt, taskId) {
        if (evt.target.closest(
            'a, button, input, select, textarea, .c-kebab, .c-expand')) return;
        // Selecting text (e.g. copying a desc) ends with a click on the
        // row — don't treat that as a toggle.
        if (window.getSelection && String(window.getSelection())) return;
        toggleInlineExpand(evt, taskId);
    }

    // t-391: Complete-row shape. id + stage + desc, plus value emoji, heat
    // number, short commit sha. No priority/hp/reason — those aren't
    // actionable for shipped work.
    function renderCompleteRow(body, t) {
        const tr = document.createElement('tr');
        tr.className = 'c-complete-row';
        tr.dataset.taskId = t.id;
        tr.dataset.status = t.status;
        const isOpen = expanded.has(t.id);
        const signal = t.ship_signal || '';
        const valTxt = t.ship_value ? (signal + ' ' + t.ship_value) : (signal || '—');
        const heat = t.ship_heat ? ('h' + t.ship_heat) : '—';
        const sha = t.commit_sha ? `<code class="c-sha">${t.commit_sha}</code>` : '—';
        // t-527: complete row shape — id + stage + ship metrics, desc
        // in a second tr below the primary row (same pattern as
        // pending/deferred rows). Primary row now has 10 cells to match
        // the new header.
        tr.innerHTML =
            `<td class="c-check"></td>` +
            `<td class="c-expand ${isOpen ? 'open' : ''}" onclick="toggleInlineExpand(event, '${t.id}')">${isOpen ? '▾' : '▸'}</td>` +
            `<td class="c-id"><a href="#" onclick="openDrawer('${t.id}');return false;">${t.id}</a></td>` +
            `<td class="c-stage-cell"><span class="c-stage stage-${t.stage}">${t.stage}</span></td>` +
            `<td class="c-ship-val" title="outcome signal + value">${valTxt}</td>` +
            `<td class="c-ship-heat">${heat}</td>` +
            `<td class="c-ship-sha" colspan="4">${sha}</td>`;
        tr.addEventListener('click', e => onRowClickToggle(e, t.id));  // t-546
        body.appendChild(tr);
        const descRow = document.createElement('tr');
        descRow.className = 'c-desc-row';
        descRow.dataset.descFor = t.id;  // not data-task-id — see renderRow
        descRow.innerHTML =
            `<td></td><td></td>` +
            `<td class="c-desc-cell" colspan="8" onclick="toggleInlineExpand(event, '${t.id}')">` +
            `<span class="c-desc-line"><span class="c-desc-preview">${descPreview(t)}</span></span>` +
            `</td>`;
        body.appendChild(descRow);
        if (isOpen) body.appendChild(buildInlinePanel(t));
    }

    // t-580: collapsed desc preview — FIRST LINE only, fully HTML-escaped,
    // so a multi-line description renders as one truncated line (not a tall
    // pre-wrap blob). Full text stays available in the expanded panel.
    function descPreview(t) {
        const first = (t.desc || '(no description)').split(String.fromCharCode(10))[0];
        return first.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // t-548: compact bounce badge for the primary row — latest
    // (done, rejected) heat pair + total bounce count. Tasks that never
    // bounced render nothing.
    function formatBounce(t) {
        const rh = t.reject_history || [];
        if (!rh.length) return '';
        const last = rh[rh.length - 1];
        const done = (last.done_heat != null) ? ('done h' + last.done_heat) : 'done h?';
        const times = rh.length > 1 ? ` (x${rh.length})` : '';
        return ` <span class="c-bounce" title="assembly bounce ledger — expand row for full list">` +
               `${done} / rejected h${last.rejected_heat}${times}</span>`;
    }

    // t-548: full bounce ledger for the inline panel, oldest first.
    function formatBounceList(t) {
        const rh = t.reject_history || [];
        if (!rh.length) return '—';
        return rh.map(b =>
            `done h${b.done_heat != null ? b.done_heat : '?'} → rejected h${b.rejected_heat}` +
            (b.reason ? ` — ${String(b.reason).replace(/</g, '&lt;')}` : '')
        ).join('<br>');
    }

    function buildInlinePanel(t) {
        const tr = document.createElement('tr');
        tr.className = 'c-inline-panel';
        tr.dataset.panelFor = t.id;
        // t-527: inline-panel colspan updated to 8 (primary row is now
        // 10 cells = 2 leading empties + 8-wide body).
        tr.innerHTML =
            `<td></td><td></td><td colspan="8" class="c-inline-body">
                <div class="c-inline-desc"></div>
                <dl class="c-inline-dl">
                    <dt>reason</dt><dd>${t.priority_reason || '—'}</dd>
                    <dt>initiative</dt><dd>${t.initiative_id || '—'}</dd>
                    <dt>blocked by</dt><dd>${(t.blocked_by || []).join(', ') || '—'}</dd>
                    <dt>age</dt><dd>${formatAge(t.age_minutes)}</dd>
                    <dt>bounces</dt><dd>${formatBounceList(t)}</dd>
                </dl>
                <div class="c-inline-history" data-history-for="${t.id}">Loading history…</div>
            </td>`;
        // t-580: render the description as faithful PLAIN TEXT — textContent
        // (not innerHTML) preserves newlines + runs of spaces exactly with
        // white-space:pre-wrap + monospace, and removes the old partial-escape
        // ('<'-only) HTML/entity leak.
        tr.querySelector('.c-inline-desc').textContent = t.desc || '(no description)';
        // Fetch full detail (history) lazily.
        fetch('/api/task/' + t.id).then(r => r.json()).then(data => {
            const box = tr.querySelector('.c-inline-history');
            if (!box) return;
            const hist = (data.history || []).slice(0, 6);
            if (!hist.length) { box.textContent = 'No history recorded.'; return; }
            box.innerHTML = '<strong>history</strong><ul>' + hist.map(h =>
                `<li>${h.ts ? h.ts.slice(0,16).replace('T',' ') : ''} · ${h.source}` +
                (h.field ? ` — ${h.field}: ${h.before} → ${h.after}` : '') + '</li>'
            ).join('') + '</ul>';
        }).catch(() => {
            const box = tr.querySelector('.c-inline-history');
            if (box) box.textContent = '(history unavailable)';
        });
        return tr;
    }

    function toggleInlineExpand(evt, taskId) {
        // MUST: stop propagation so any wrapping handlers don't navigate.
        if (evt) { evt.stopPropagation(); evt.preventDefault(); }
        if (expanded.has(taskId)) expanded.delete(taskId);
        else expanded.add(taskId);
        // Re-render without refetch — flip panel on the current dataset.
        const body = document.getElementById('rows');
        const tr = body.querySelector(`tr[data-task-id="${taskId}"]`);
        if (!tr) { loadRows(); return; }
        const existing = body.querySelector(`tr.c-inline-panel[data-panel-for="${taskId}"]`);
        const chev = tr.querySelector('.c-expand');
        if (existing) {
            existing.remove();
            if (chev) { chev.textContent = '▸'; chev.classList.remove('open'); }
        } else {
            // Build from the row's current data via /api/task. We don't have the
            // full row object here; synthesize from visible cells + fetch.
            fetch('/api/task/' + taskId).then(r => r.json()).then(data => {
                const task = data.task || {};
                task.age_heats = null; // age stays on the collapsed row; panel uses worklog count
                const panel = buildInlinePanel(task);
                tr.after(panel);
                if (chev) { chev.textContent = '▾'; chev.classList.add('open'); }
            });
        }
    }

    function openDrawer(taskId) {
        // Deep-link via ?task= — Poker home handles the drawer.
        window.location.href = '/?task=' + encodeURIComponent(taskId);
    }

    function bumpHP(taskId, delta) {
        // Read current, offset by delta. A null hp becomes delta directly (signed).
        fetch('/api/task/' + taskId).then(r => r.json()).then(data => {
            const cur = (data.task && data.task.human_priority);
            const next = (cur == null ? 0 : cur) + delta;
            return fetch('/api/task/' + taskId + '/human-priority', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({value: next})
            });
        }).then(loadRows);
    }

    function clearHP(taskId) {
        fetch('/api/task/' + taskId + '/human-priority', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({value: null})
        }).then(loadRows);
    }

    function toggleDefer(taskId, status) {
        const path = (status === 'deferred') ? '/undefer' : '/defer';
        fetch('/api/task/' + taskId + path, {method: 'POST'}).then(loadRows);
    }

    // t-389: DnD reorder within the Pending section.
    // Drop at top → hp=0. Elsewhere → hp = idx*10 across all pending rows.
    // Blocked tasks snap back above their blocker (visual reject, no fetch).
    let dragState = null;

    function pendingRows() {
        return Array.from(document.querySelectorAll(
            '#rows tr[data-task-id][data-status="pending"]'));
    }

    function onRowDragStart(evt) {
        const tr = evt.currentTarget;
        dragState = { id: tr.dataset.taskId, row: tr };
        tr.classList.add('c-dragging');
        if (evt.dataTransfer) {
            evt.dataTransfer.effectAllowed = 'move';
            evt.dataTransfer.setData('text/plain', tr.dataset.taskId);
        }
    }

    function onRowDragOver(evt) {
        if (!dragState) return;
        const tr = evt.currentTarget;
        if (tr === dragState.row) return;
        evt.preventDefault();
        if (evt.dataTransfer) evt.dataTransfer.dropEffect = 'move';
        const rect = tr.getBoundingClientRect();
        const above = (evt.clientY - rect.top) < rect.height / 2;
        tr.classList.toggle('c-drop-above', above);
        tr.classList.toggle('c-drop-below', !above);
    }

    function onRowDragLeave(evt) {
        evt.currentTarget.classList.remove('c-drop-above', 'c-drop-below');
    }

    function onRowDragEnd(evt) {
        evt.currentTarget.classList.remove('c-dragging');
        document.querySelectorAll('.c-drop-above, .c-drop-below')
            .forEach(el => el.classList.remove('c-drop-above', 'c-drop-below'));
        dragState = null;
    }

    function onRowDrop(evt) {
        if (!dragState) return;
        evt.preventDefault();
        const target = evt.currentTarget;
        const rect = target.getBoundingClientRect();
        const above = (evt.clientY - rect.top) < rect.height / 2;
        target.classList.remove('c-drop-above', 'c-drop-below');
        const draggedId = dragState.id;
        if (target === dragState.row) return;

        // Compute candidate new order of pending ids.
        const current = pendingRows().map(r => r.dataset.taskId);
        const withoutDragged = current.filter(id => id !== draggedId);
        const targetId = target.dataset.taskId;
        const insertAt = withoutDragged.indexOf(targetId) + (above ? 0 : 1);
        const newOrder = withoutDragged.slice(0, insertAt)
            .concat([draggedId])
            .concat(withoutDragged.slice(insertAt));

        // Blocker pre-check (client-side snap-back). Server repeats the check.
        const blockedBy = (dragState.row.dataset.blockedBy || '')
            .split(',').filter(Boolean);
        const draggedIdx = newOrder.indexOf(draggedId);
        const violation = blockedBy.find(b => {
            const bi = newOrder.indexOf(b);
            return bi !== -1 && bi >= draggedIdx;
        });
        if (violation) {
            dragState.row.classList.add('c-drop-reject');
            setTimeout(() => dragState && dragState.row &&
                dragState.row.classList.remove('c-drop-reject'), 500);
            return;
        }

        const prevOrder = current.slice();  // snapshot for undo
        submitReorder(newOrder, prevOrder, draggedId, target);
    }

    function submitReorder(newOrder, prevOrder, draggedId, rejectTarget) {
        fetch('/api/reorder-tasks', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({order: newOrder})
        }).then(r => r.json()).then(resp => {
            if (!resp.ok) {
                const tgt = rejectTarget ||
                    document.querySelector(`#rows tr[data-task-id="${draggedId}"]`);
                if (tgt) {
                    tgt.classList.add('c-drop-reject');
                    setTimeout(() => tgt.classList.remove('c-drop-reject'), 500);
                }
            } else if (prevOrder && prevOrder.length) {
                showUndoToast(`Moved ${draggedId}`, prevOrder);
            }
            loadRows();
        });
    }

    // t-392: undo toast. Snapshots the prior order; Undo re-POSTs it.
    let toastTimer = null;
    function showUndoToast(msg, prevOrder) {
        const toast = document.getElementById('c-toast');
        const txt = document.getElementById('c-toast-msg');
        const btn = document.getElementById('c-toast-undo');
        if (!toast || !txt || !btn) return;
        txt.textContent = msg;
        toast.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toast.hidden = true; }, 6000);
        btn.onclick = () => {
            toast.hidden = true;
            clearTimeout(toastTimer);
            // Undo is itself a reorder — no toast on success (would loop).
            fetch('/api/reorder-tasks', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({order: prevOrder})
            }).then(loadRows);
        };
    }

    // t-392: Alt-arrow a11y reorder. Operates on pending rows only; falls back
    // silently if the focused row is deferred/complete.
    function altMoveFocused(delta) {
        const pending = pendingRows();
        if (!pending.length) return;
        const rows = document.querySelectorAll('#rows tr[data-task-id]');
        if (focusedIndex < 0 || focusedIndex >= rows.length) return;
        const focused = rows[focusedIndex];
        const id = focused.dataset.taskId;
        const pendingIds = pending.map(r => r.dataset.taskId);
        const idx = pendingIds.indexOf(id);
        if (idx < 0) return;   // focused row isn't pending; ignore.
        const newIdx = idx + delta;
        if (newIdx < 0 || newIdx >= pendingIds.length) return;
        const newOrder = pendingIds.slice();
        [newOrder[idx], newOrder[newIdx]] = [newOrder[newIdx], newOrder[idx]];
        // Client-side blocker pre-check (mirrors drop handler).
        const blockedBy = (focused.dataset.blockedBy || '').split(',').filter(Boolean);
        const myIdx = newOrder.indexOf(id);
        const violation = blockedBy.find(b => {
            const bi = newOrder.indexOf(b);
            return bi !== -1 && bi >= myIdx;
        });
        if (violation) {
            focused.classList.add('c-drop-reject');
            setTimeout(() => focused.classList.remove('c-drop-reject'), 500);
            return;
        }
        submitReorder(newOrder, pendingIds.slice(), id, focused);
    }

    // Keyboard nav (t-379): j/k move row focus, Enter opens drawer, x toggles defer.
    let focusedIndex = -1;
    function focusRow(i) {
        const rows = document.querySelectorAll('#rows tr[data-task-id]');
        if (!rows.length) return;
        rows.forEach(r => r.classList.remove('c-focused'));
        focusedIndex = Math.max(0, Math.min(i, rows.length - 1));
        rows[focusedIndex].classList.add('c-focused');
        rows[focusedIndex].scrollIntoView({block: 'nearest'});
    }
    document.addEventListener('keydown', e => {
        // Skip when typing in filter inputs.
        const tag = (e.target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
        // t-392: Alt-↑/↓ a11y reorder for the focused pending row.
        if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
            e.preventDefault();
            altMoveFocused(e.key === 'ArrowUp' ? -1 : 1);
            return;
        }
        if (e.key === 'j') { e.preventDefault(); focusRow(focusedIndex + 1); }
        else if (e.key === 'k') { e.preventDefault(); focusRow(focusedIndex - 1); }
        else if (e.key === 'Enter' && focusedIndex >= 0) {
            const row = document.querySelectorAll('#rows tr[data-task-id]')[focusedIndex];
            if (row) openDrawer(row.dataset.taskId);
        } else if (e.key === 'x' && focusedIndex >= 0) {
            const row = document.querySelectorAll('#rows tr[data-task-id]')[focusedIndex];
            if (row) {
                const isDeferred = row.classList.contains('deferred-row');
                toggleDefer(row.dataset.taskId, isDeferred ? 'deferred' : 'pending');
            }
        }
    });

    // Live refresh via Poker's SSE stream.
    try {
        const es = new EventSource('/events');
        es.onmessage = () => loadRows();
    } catch (e) { /* SSE unavailable — polling fallback below */ }
    setInterval(loadRows, 15000);
    loadRows();
    </script>
</body>
</html>
