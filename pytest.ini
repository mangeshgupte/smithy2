[pytest]
# t-428: the Smithy repo has two historical test directories:
#   - `smithy/tests/` — pre-fork tests for the pip-installable package
#   - `tests/` — everything added at the rig level since the fork
# Default pytest discovery from the repo root picks up both, but a
# bare `python3 -m pytest` run from `smithy/` silently scopes to just
# `smithy/tests/` (because `smithy/pyproject.toml` gets picked up as the
# config root). That silent scope-narrowing is what let two rounds of
# forge-quench submissions pass locally (from `smithy/`) and then fail
# in Assembly's run (from the repo root with the tests/ dir included).
# This file pins discovery to both paths regardless of cwd — the
# canonical invocation is `python3 -m pytest -q` from the repo root
# (which is also Assembly's invocation — see smithy/smithy/assembly.py
# run_tests_in_worktree).
testpaths =
    smithy/tests
    tests

# t-428: keep the warnings concise; suppress pytest's default noisy
# DeprecationWarning floods so the gate output stays readable.
filterwarnings =
    ignore::DeprecationWarning
